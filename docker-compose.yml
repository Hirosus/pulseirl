version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: pulseirl-postgres
    environment:
      POSTGRES_USER: pulseirl_admin
      POSTGRES_PASSWORD: pulseirl_secure_password
      POSTGRES_DB: pulseirl_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseirl_admin -d pulseirl_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: pulseirl-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
